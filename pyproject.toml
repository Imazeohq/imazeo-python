[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "imazeo"
version = "1.0.1"
description = "Official Imazeo Python SDK for server-side image, transform, PDF, QR, and barcode APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Imazeo" }]
keywords = [
  "imazeo",
  "images",
  "transforms",
  "pdf",
  "qr",
  "barcode",
  "sdk",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://pypi.org/project/imazeo/"
Documentation = "https://github.com/Imazeohq/imazeo-python#readme"
Repository = "https://github.com/Imazeohq/imazeo-python"
Issues = "https://github.com/Imazeohq/imazeo-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/GUIDE.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/openapi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"openapi/backend.json" = "imazeo/openapi/backend.json"
"GUIDE.md" = "imazeo/GUIDE.md"
