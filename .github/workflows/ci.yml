name: SDK verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev]' build pip-audit
      - run: python -m pytest
      - run: pip-audit
      - run: python -m build
