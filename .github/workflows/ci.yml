name: SDK verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-release.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev]' build pip-audit
      - run: python -m pytest
      # Runtime deps only — build/dev tools (setuptools, filelock, …) are not package deps.
      - name: Audit runtime dependencies
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          block = re.search(r"(?ms)^dependencies\s*=\s*\[(.*?)\]", text).group(1)
          deps = re.findall(r'"([^"]+)"', block)
          Path("requirements-audit.txt").write_text("\n".join(deps) + "\n", encoding="utf-8")
          PY
          pip-audit -r requirements-audit.txt
      - run: python -m build
